# CodeFactor: grade production code; exclude vendored assets, the example
# corpus and generated output. Test files stay rated — see must* helpers
# in internal/database/database_test.go.
ratings:
  paths:
    - "cmd/**"
    - "internal/**"
    - "scripts/**"
exclude:
  - "internal/server/static/vendor/**"
  - "example-knowledge/**"
  - "coverage.out"
  - "test-report.json"
