# SonarQube / SonarCloud configuration.
# The CI coverage job produces coverage.out (Go coverprofile) and
# test-report.json (go test -json) — both are consumed natively.
# For SonarCloud additionally set sonar.organization and point
# SONAR_HOST_URL at https://sonarcloud.io (see docs/TESTING.md).
sonar.projectKey=gundestrup_Knowledge-BA46-Flow
sonar.projectName=Knowledge-BA46-Flow
sonar.organization=gundestrup
sonar.host.url=https://sonarcloud.io
sonar.sources=cmd,internal
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go
sonar.exclusions=internal/server/static/**
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.json
sonar.sourceEncoding=UTF-8
