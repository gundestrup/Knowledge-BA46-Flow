# CLI help text — Short/Long descriptions and flag usage for KBM-flow commands.
cli.root.short: "Maintain a markdown knowledge repository with a local LLM"
cli.root.long: "Knowledge-BA46-Flow scans a markdown repository, asks a local Ollama model for maintenance suggestions (move/merge/expand/delete), and only changes files after explicit human acceptance.\n\nFlow: run -> list/review -> apply.\nreport refreshes the separate local repository health report.\nserve starts an HTTP API with a home page and separate knowledge/report workspaces."
cli.scan.short: "Scan the repository and sync SQLite (no Ollama calls)"
cli.link_check.short: "Check external links in documents and record verdicts (network calls; no LLM)"
cli.validate.short: "Check repository structure against taxonomy.yaml and linking conventions"
cli.analyze.short: "Analyze changed documents with Ollama (LLM calls)"
cli.run.short: "Scan, then analyze changed documents"
cli.enrich.short: "Run only the fast enrichment pass (title/tags metadata)"
cli.embed.short: "Recompute embedding vectors for new/changed documents"
cli.expand.short: "Expand stub documents using their category STUB.md templates"
cli.freshness.short: "Flag documents that may no longer be current (heuristic review)"
cli.tasks.short: "Run every configured LLM task (enrich, embed, expand, freshness, analyze)"
cli.report.short: "Refresh the local repository health report"
cli.list.short: "Show pending suggestions"
cli.review.short: "Interactive accept/reject of pending suggestions"
cli.decide.short: "{{.Action}} a single pending suggestion"
cli.apply.short: "Execute all accepted suggestions"
cli.prune.short: "Delete finished job history beyond the newest --keep rows, optionally purge old trash"
cli.serve.short: "HTTP API + web UI for the review workflow"
cli.version.short: "Print the application version"
cli.flag.config: "path to config file"
cli.flag.reanalyze: "also re-analyze documents whose last analysis used a different model"
cli.flag.reanalyze_all: "force every non-missing document through enrichment and analysis (expensive)"
cli.flag.external_analyze: "analyze with ollama_model_external (enhanced lane; results stamp external_* and keep the local lineage)"
cli.flag.model: "run generation stages with this configured or installed Ollama model"
cli.flag.embed_model: "use this embedding model independently of --model"
cli.flag.allow_cloud: "allow cloud/remote embeddings and enrichment (sends document content off-machine)"
cli.flag.task_reanalyze: "also reprocess documents whose last pass used a different model"
cli.flag.task_reanalyze_all: "force every non-missing document through the pass (expensive)"
cli.flag.tasks_reanalyze_all: "force every non-missing document through every pass (expensive)"
cli.flag.task_model: "run this pass with a configured or installed Ollama model"
cli.flag.task_embed_model: "embedding model override (alternative to --model)"
cli.flag.task_external: "use ollama_model_external for this pass"
cli.flag.task_allow_cloud: "allow cloud/remote models for this pass (sends content off-machine)"
cli.flag.task_allow_remote: "consent to remote/cloud models this pass resolves — keeps per-task routing and stamps"
cli.flag.web_verify: "verify freshness flags via Ollama web search (claim text is sent to ollama.com; requires OLLAMA_API_KEY)"
cli.flag.tasks_external: "allow cloud/remote generation models and use ollama_model_external when selected"
cli.flag.allow_remote: "consent to remote/cloud models this run resolves (any lane; keeps per-task routing and stamps)"
cli.flag.tasks_model: "run every generation task with this configured or installed Ollama model"
cli.flag.repo: "refresh one registered repository by name"
cli.flag.force: "force remote checks and refresh package registry caches"
cli.flag.no_remote: "run local checks only and retain cached remote results"
cli.flag.remote: "enable remote checks for this run"
cli.flag.json: "print the complete report snapshot as JSON"
cli.flag.keep: "number of newest finished jobs to retain"
cli.flag.trash_days: "also permanently delete trash entries older than this many days (0 = keep all)"
cli.flag.note: "why the suggestion is wrong — stored on the row and shown back to the model on later runs"

