# CLI help text — Short/Long descriptions and flag usage for KBM-flow commands.
cli.root.short: "Vedligehold et Markdown knowledge repository med en local LLM"
cli.root.long: "Knowledge-BA46-Flow scanner et Markdown repository, beder en local Ollama model om maintenance suggestions (move/merge/expand/delete) og ændrer først filer efter explicit human acceptance.\n\nFlow: run -> list/review -> apply.\nreport refresher den separate local repository health report.\nserve starter en HTTP API med en home page og separate knowledge/report workspaces."
cli.scan.short: "Scan repository, og sync SQLite (ingen Ollama calls)"
cli.link_check.short: "Kontrollér external links i dokumenter, og registrér verdicts (network calls; ingen LLM)"
cli.validate.short: "Kontrollér repository structure mod taxonomy.yaml og linking conventions"
cli.analyze.short: "Analysér changed documents med Ollama (LLM calls)"
cli.run.short: "Scan, og analysér derefter changed documents"
cli.enrich.short: "Kør kun fast enrichment pass (title/tags metadata)"
cli.embed.short: "Genberegn embedding vectors for new/changed documents"
cli.expand.short: "Expand stub documents ved hjælp af deres category STUB.md templates"
cli.freshness.short: "Flag dokumenter, der muligvis ikke længere er current (heuristic review)"
cli.tasks.short: "Kør alle configured LLM tasks (enrich, embed, expand, freshness, analyze)"
cli.report.short: "Refresh local repository health report"
cli.list.short: "Vis pending suggestions"
cli.review.short: "Interactive accept/reject af pending suggestions"
cli.decide.short: "{{.Action}} et enkelt pending suggestion"
cli.apply.short: "Udfør alle accepted suggestions"
cli.prune.short: "Slet finished job history ud over de nyeste --keep rows, og purge eventuelt old trash"
cli.serve.short: "HTTP API + web UI til review workflow"
cli.version.short: "Vis application version"
cli.flag.config: "path til config file"
cli.flag.reanalyze: "re-analyze også dokumenter, hvis deres last analysis brugte en anden model"
