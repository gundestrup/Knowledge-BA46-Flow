cli.flag.model: "kør generation stages med denne configured eller installed Ollama model"
cli.flag.embed_model: "brug denne embedding model uafhængigt af --model"
cli.flag.allow_cloud: "tillad cloud/remote embeddings og enrichment (sender document content off-machine)"
cli.flag.task_reanalyze: "reprocess også dokumenter, hvis deres last pass brugte en anden model"
cli.flag.task_reanalyze_all: "force alle non-missing documents gennem pass (expensive)"
cli.flag.tasks_reanalyze_all: "force alle non-missing documents gennem alle passes (expensive)"
